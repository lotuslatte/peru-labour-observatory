# Method breaks in the published series.
# A comparison between a year before `year` and `year` or later crosses the break:
# it keeps its value but is never reported as significant.
# `before_es` / `after_es` name the source of the series on each side; indicator pages show them per year.
breaks:
  - id: informality_rule_2024
    year: 2024
    indicators: [informality, formality]
    before_es: "Variable ocupinf del INEI"
    after_es: "Regla del Observatorio"
    label_es: "Desde 2024 INEI no publica ocupinf: la informalidad usa la regla del Observatorio y no es comparable con años previos."
    label_en: "INEI stopped publishing ocupinf in 2024: informality uses the Observatory rule and is not comparable with earlier years."
  - id: informal_sector_rule_2024
    year: 2024
    indicators: [informal_in_sector]
    before_es: "Variable emplpsec del INEI"
    after_es: "Regla del Observatorio (empleo informal en unidad sin RUC)"
    label_es: "Desde 2024 INEI no publica emplpsec: el sector informal usa la regla del Observatorio, que en 2021–2023 da cerca de 1 punto menos que emplpsec (98% de concordancia). No es comparable con años previos."
    label_en: "INEI stopped publishing emplpsec in 2024: the informal sector uses the Observatory rule, about 1 point below emplpsec in 2021–2023 (98% agreement). Not comparable with earlier years."
